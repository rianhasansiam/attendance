allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  unrs-resolver: false
  argon2: true
  '@parcel/watcher': false
  '@swc/core': false
# Security fixes for Prisma's transitive dependencies.
overrides:
  lodash: 4.18.1
  '@prisma/config>deepmerge-ts': 8.0.0
  'prisma>mysql2': 3.23.1
